<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Received | Magnificent Media</title>
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0a09'/%3E%3Cpath d='M14 46V18l18 20 18-20v28' fill='none' stroke='%23c9a96e' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/assets/luxe.css?v=4">
<style>
  body { min-height: 100svh; display: flex; flex-direction: column; }
  header { background: rgba(11,10,9,.78); border-bottom-color: var(--line); }
  main { flex: 1; display: grid; place-items: center; text-align: center; padding: 140px var(--gutter) 100px; position: relative; overflow: hidden; }
  main::before { content: ""; position: absolute; inset: 0; background: url("/media/lens.jpg") center / cover no-repeat; opacity: .28; }
  main::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(11,10,9,.35), var(--ink) 72%); }
  .inner { position: relative; z-index: 1; max-width: 640px; }
  .seal { width: 76px; height: 76px; margin: 0 auto 34px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #3a332b, #15120f 70%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 0 0 1px rgba(201,169,110,.6), 0 0 0 8px rgba(201,169,110,.06), 0 18px 40px -12px rgba(0,0,0,.9); }
  .seal svg { width: 30px; height: 24px; }
  h1 { font-size: clamp(48px, 7vw, 92px); line-height: .98; margin: 22px 0 24px; }
  .inner .body-lg { margin: 0 auto 42px; }
  @media (max-width: 560px) { .inner .btn { width: 100%; } }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="wordmark" href="/" aria-label="Magnificent Media home">
      <svg viewBox="0 0 30 30" aria-hidden="true"><rect x=".5" y=".5" width="29" height="29" fill="none" stroke="#c9a96e" stroke-opacity=".55"/><path d="M7 22V8.5l8 9 8-9V22" fill="none" stroke="#e6d1a3" stroke-width="1.2"/></svg>
      <span>Magnificent Media</span>
    </a>
  </div>
</header>
<main>
  <div class="inner">
    <div class="seal" aria-hidden="true"><svg viewBox="0 0 30 24"><path d="M2 12.5l8.5 8.5L28 3" fill="none" stroke="#e6d1a3" stroke-width="2"/></svg></div>
    <span class="label gold"><span class="rule"></span>Details received</span>
    <h1>Thank you. <em>We're on it.</em></h1>
    <p class="body-lg">Your details are in. One step left: send us your clips, and your first batch begins.</p>
    <a class="btn btn-gold" href="/welcome/#upload">Upload your clips <span class="arrow"></span></a>
  </div>
</main>
